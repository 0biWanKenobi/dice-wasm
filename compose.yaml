services:
  wasm-build:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - rust-target:/workspace/target
    environment:
      CARGO_HOME: /usr/local/cargo
    command: ["sh", "./build.sh"]
volumes:
  cargo-registry:
  cargo-git:
  rust-target:
