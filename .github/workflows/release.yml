name: Build and publish WASM package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust tests
        run: cargo test --locked
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Compile WASM npm package
        run: sh ./build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Finalize npm metadata
        run: node scripts/prepare-package.mjs
      - name: Check published API surface
        run: node scripts/check-package.mjs
      - name: Verify npm tarball
        working-directory: dist
        run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: dice-wasm-npm
          path: dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: dice-wasm-npm
          path: dist/
      - name: Validate tag and package version
        shell: bash
        run: |
          VERSION="$(node -p 'require("./dist/package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - name: Publish to npm using trusted publishing
        working-directory: dist
        run: |
          npm install -g npm@latest
          npm publish --access public --provenance
      - name: Create release tarball
        working-directory: dist
        run: npm pack --pack-destination ..
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" ./*.tgz --generate-notes --verify-tag
