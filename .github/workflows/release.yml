name: Build and release WASM package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust tests
        run: cargo test --locked
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Compile browser WASM package
        run: sh ./build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Finalize package metadata
        run: node scripts/prepare-package.mjs
      - name: Check generated API and assets
        run: node scripts/check-package.mjs
      - name: Verify package archive
        working-directory: dist
        run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: dice-wasm-package
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: dice-wasm-package
          path: dist/
      - name: Check release version matches Cargo and package
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p 'require("./dist/package.json").version')"
          CARGO_VERSION="$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"
          test "${PACKAGE_VERSION}" = "${CARGO_VERSION}"
      - name: Produce versioned installable archive
        working-directory: dist
        shell: bash
        run: |
          TARBALL="$(npm pack --pack-destination .. --silent)"
          mv "../${TARBALL}" "../dice-wasm-${GITHUB_REF_NAME}.tgz"
      - name: Publish package to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}"             "dice-wasm-${GITHUB_REF_NAME}.tgz"             --generate-notes --verify-tag
